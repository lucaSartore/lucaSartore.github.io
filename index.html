<!DOCTYPE html>
<html>
<head>
    <title>Query Parameter Display</title>
</head>
<body>
    <div id="output"></div>

    <script>
        // Get the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const data = urlParams.get('data');
        
        // Display the data on screen
        document.getElementById('output').textContent = data || 'No data parameter found';
        
        // Log the length to console
        console.log('Data length:', data ? data.length : 0);
    </script>
</body>
</html>
